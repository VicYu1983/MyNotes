version: '3.8'

services:
  web:
    build: .
    container_name: mynotes-app
    ports:
      - "8080:80"
    volumes:
      - .:/usr/share/nginx/html
    environment:
      - TZ=Asia/Taipei
    restart: unless-stopped
    networks:
      - mynotes-network

networks:
  mynotes-network:
    driver: bridge
