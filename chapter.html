<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式學習 - 章節內容</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .back-button:hover {
            background: #5568d3;
        }

        .level-section {
            margin-bottom: 40px;
        }

        .level-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #f0f0f0;
        }

        .level-badge {
            padding: 8px 20px;
            border-radius: 20px;
            color: white;
            font-weight: 600;
            font-size: 1.1em;
        }

        .knowledge-list {
            display: grid;
            gap: 15px;
        }

        .knowledge-item {
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .knowledge-item:hover {
            background: #eff1f7;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .knowledge-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .knowledge-number {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
            margin-right: 12px;
            min-width: 30px;
        }

        .knowledge-title {
            font-size: 1em;
            font-weight: 600;
            color: #333;
        }

        .knowledge-subtitle {
            color: #999;
            font-size: 0.85em;
            margin-bottom: 0;
            font-style: italic;
            display: none;
        }

        .knowledge-content {
            line-height: 1.6;
            color: #555;
            font-size: 0.95em;
        }

        .knowledge-content h3 {
            color: #667eea;
            margin: 12px 0 8px 0;
            font-size: 1em;
        }

        .knowledge-content ul {
            margin-left: 20px;
            margin-bottom: 10px;
        }

        .knowledge-content li {
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .knowledge-content p {
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .knowledge-content strong {
            color: #333;
        }

        .collapsed {
            display: none;
        }

        .expanded {
            display: block;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #ddd;
        }

        .sub-section {
            margin-left: 20px;
            margin-top: 15px;
        }

        .sub-section h4 {
            color: #667eea;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .quiz-button {
            display: block;
            width: 100%;
            margin: 30px 0;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .quiz-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .quiz-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            overflow-y: auto;
        }

        .quiz-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .quiz-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .quiz-header h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .quiz-progress {
            color: #666;
            font-size: 0.9em;
        }

        .quiz-question {
            margin-bottom: 25px;
        }

        .quiz-question h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .quiz-option {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .quiz-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .quiz-option.selected {
            border-color: #667eea;
            background: #e8ecff;
        }

        .quiz-option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .quiz-option.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .quiz-explanation {
            margin-top: 15px;
            padding: 15px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 5px;
            display: none;
        }

        .quiz-explanation.show {
            display: block;
        }

        .quiz-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .quiz-btn {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quiz-btn-primary {
            background: #667eea;
            color: white;
        }

        .quiz-btn-primary:hover {
            background: #5568d3;
        }

        .quiz-btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .quiz-btn-secondary:hover {
            background: #d0d0d0;
        }

        .quiz-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .quiz-result {
            text-align: center;
            padding: 30px;
        }

        .quiz-result h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .quiz-score {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .quiz-result p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .knowledge-number {
                font-size: 1em;
                min-width: 25px;
            }

            .knowledge-title {
                font-size: 0.95em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← 返回主頁</a>
        
        <div class="header" id="header">
            <!-- 動態載入標題 -->
        </div>

        <div id="content">
            <!-- 動態載入內容 -->
        </div>
    </div>

    <!-- 測驗彈窗 -->
    <div id="quizModal" class="quiz-modal">
        <div class="quiz-container">
            <div id="quizContent"></div>
        </div>
    </div>

    <script>
        let quizData = null;
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let selectedAnswer = null;
        // 從URL參數取得主題ID
        function getTopicIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('topic') || 'smart-home';
        }

        // 載入所有階層的 JSON 資料
        async function loadData() {
            try {
                const topicId = getTopicIdFromURL();

                // 先載入配置文件
                const configResponse = await fetch('config.json');
                const config = await configResponse.json();

                // 找到對應的主題
                const topic = config.topics.find(t => t.id === topicId);
                if (!topic) {
                    throw new Error(`主題 ${topicId} 未找到`);
                }

                // 按照配置載入所有階層的JSON
                const levelPromises = topic.levels.map(level => 
                    fetch(level.jsonFile).then(res => res.json())
                );
                const levels = await Promise.all(levelPromises);

                const data = {
                    topic: {
                        id: topic.id,
                        title: topic.title,
                        icon: topic.icon,
                        subtitle: topic.subtitle,
                        questionFile: topic.questionFile
                    },
                    levels: levels
                };

                // 如果有測驗檔案，載入測驗資料
                if (topic.questionFile) {
                    try {
                        const quizResponse = await fetch(topic.questionFile);
                        quizData = await quizResponse.json();
                    } catch (err) {
                        console.warn('測驗資料載入失敗:', err);
                    }
                }

                renderContent(data);
            } catch (error) {
                console.error('載入資料失敗:', error);
                document.getElementById('content').innerHTML = '<p style="color: red;">資料載入失敗，請重新整理頁面。</p>';
            }
        }

        // 渲染頁面內容
        function renderContent(data) {
            // 渲染標題
            const header = document.getElementById('header');
            header.innerHTML = `
                <h1>${data.topic.icon} ${data.topic.title}</h1>
                <p class="subtitle">${data.topic.subtitle}</p>
            `;

            // 更新頁面標題
            document.title = `${data.topic.title} - 互動式學習`;

            // 渲染知識點
            const content = document.getElementById('content');
            let html = '';

            data.levels.forEach(level => {
                if (level.knowledgePoints.length === 0) return;

                html += `
                    <div class="level-section">
                        <div class="level-header">
                            <span class="level-badge" style="background: ${level.level.color}">${level.level.emoji} ${level.level.name}</span>
                            <span>${level.level.description}</span>
                        </div>
                        <div class="knowledge-list">
                `;

                level.knowledgePoints.forEach(point => {
                    const uniqueId = `${level.level.id}-${point.number}`;
                    // 只顯示有內容的知識點
                    if (point.sections && point.sections.length > 0) {
                        html += `
                            <div class="knowledge-item" onclick="toggleContent('${uniqueId}')">
                                <div class="knowledge-header">
                                    <div class="knowledge-number">${point.number}</div>
                                    <div class="knowledge-title">${point.title}</div>
                                </div>
                                <div class="knowledge-content collapsed" id="content-${uniqueId}">
                                    ${renderSections(point.sections)}
                                </div>
                            </div>
                        `;
                    } else {
                        // 沒有內容的知識點顯示為待補充
                        html += `
                            <div class="knowledge-item" style="opacity: 0.6; cursor: default;">
                                <div class="knowledge-header">
                                    <div class="knowledge-number">${point.number}</div>
                                    <div class="knowledge-title">${point.title}</div>
                                </div>
                                <p style="color: #888; margin-top: 8px; font-size: 0.85em;">📝 內容待補充...</p>
                            </div>
                        `;
                    }
                });

                html += `
                        </div>
                    </div>
                `;
            });

            // 如果有測驗資料，添加測驗按鈕
            if (quizData && quizData.questions && quizData.questions.length > 0) {
                html += `
                    <button class="quiz-button" onclick="startQuiz()">
                        📝 開始測驗（共 ${quizData.questions.length} 題）
                    </button>
                `;
            }

            content.innerHTML = html;
        }

        // 渲染段落內容
        function renderSections(sections) {
            let html = '';
            sections.forEach(section => {
                html += `<h3>${section.heading}</h3>`;
                
                if (section.content) {
                    html += `<p>${section.content}</p>`;
                }
                
                if (section.list) {
                    html += '<ul>';
                    section.list.forEach(item => {
                        html += `<li>${item}</li>`;
                    });
                    html += '</ul>';
                }

                if (section.subSections) {
                    section.subSections.forEach(sub => {
                        html += '<div class="sub-section">';
                        html += `<h4>${sub.subHeading}</h4>`;
                        if (sub.content) {
                            html += `<p>${sub.content}</p>`;
                        }
                        if (sub.list) {
                            html += '<ul>';
                            sub.list.forEach(item => {
                                html += `<li>${item}</li>`;
                            });
                            html += '</ul>';
                        }
                        html += '</div>';
                    });
                }
            });
            return html;
        }

        // 切換內容展開/收合
        function toggleContent(id) {
            const content = document.getElementById(`content-${id}`);
            if (content.classList.contains('collapsed')) {
                content.classList.remove('collapsed');
                content.classList.add('expanded');
            } else {
                content.classList.add('collapsed');
                content.classList.remove('expanded');
            }
        }

        // 隨機排序陣列（Fisher-Yates 洗牌算法）
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 開始測驗
        function startQuiz() {
            currentQuestionIndex = 0;
            userAnswers = [];
            selectedAnswer = null;
            
            // 隨機排序題目
            if (quizData && quizData.questions) {
                quizData.questions = shuffleArray(quizData.questions);
            }
            
            showQuestion();
            document.getElementById('quizModal').classList.add('active');
        }

        // 顯示當前問題
        function showQuestion() {
            const question = quizData.questions[currentQuestionIndex];
            const quizContent = document.getElementById('quizContent');
            
            let html = `
                <div class="quiz-header">
                    <h2>📝 測驗</h2>
                    <p class="quiz-progress">第 ${currentQuestionIndex + 1} / ${quizData.questions.length} 題</p>
                </div>
                <div class="quiz-question">
                    <h3>${question.question}</h3>
                    <div class="quiz-options">
            `;

            question.options.forEach((option, index) => {
                html += `
                    <div class="quiz-option" onclick="selectAnswer(${index})">
                        ${option}
                    </div>
                `;
            });

            html += `
                    </div>
                    <div class="quiz-explanation" id="explanation"></div>
                </div>
                <div class="quiz-buttons">
                    <button class="quiz-btn quiz-btn-secondary" onclick="closeQuiz()">關閉</button>
                    <button class="quiz-btn quiz-btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>提交答案</button>
                </div>
            `;

            quizContent.innerHTML = html;
            selectedAnswer = null;
        }

        // 選擇答案
        function selectAnswer(index) {
            // 如果已經提交過，不允許再選擇
            if (userAnswers[currentQuestionIndex] !== undefined) return;

            selectedAnswer = index;
            
            // 更新選項樣式
            const options = document.querySelectorAll('.quiz-option');
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === index) {
                    opt.classList.add('selected');
                }
            });

            // 啟用提交按鈕
            document.getElementById('submitBtn').disabled = false;
        }

        // 提交答案
        function submitAnswer() {
            if (selectedAnswer === null) return;

            const question = quizData.questions[currentQuestionIndex];
            const isCorrect = selectedAnswer === question.correctAnswer;
            userAnswers[currentQuestionIndex] = isCorrect;

            // 顯示答案結果
            const options = document.querySelectorAll('.quiz-option');
            options.forEach((opt, i) => {
                opt.style.pointerEvents = 'none';
                if (i === question.correctAnswer) {
                    opt.classList.add('correct');
                } else if (i === selectedAnswer && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });

            // 顯示解釋
            const explanation = document.getElementById('explanation');
            explanation.innerHTML = `
                <strong>${isCorrect ? '✅ 答對了！' : '❌ 答錯了！'}</strong><br>
                ${question.explanation}
            `;
            explanation.classList.add('show');

            // 更新按鈕
            const submitBtn = document.getElementById('submitBtn');
            if (currentQuestionIndex < quizData.questions.length - 1) {
                submitBtn.textContent = '下一題';
                submitBtn.onclick = nextQuestion;
            } else {
                submitBtn.textContent = '查看結果';
                submitBtn.onclick = showResult;
            }
        }

        // 下一題
        function nextQuestion() {
            currentQuestionIndex++;
            showQuestion();
        }

        // 顯示結果
        function showResult() {
            const correctCount = userAnswers.filter(a => a === true).length;
            const totalCount = quizData.questions.length;
            const percentage = Math.round((correctCount / totalCount) * 100);

            let message = '';
            let emoji = '';
            if (percentage >= 90) {
                emoji = '🎉';
                message = '太棒了！你完全掌握了這個主題！';
            } else if (percentage >= 70) {
                emoji = '👍';
                message = '做得很好！繼續保持！';
            } else if (percentage >= 50) {
                emoji = '💪';
                message = '還不錯！再複習一下會更好！';
            } else {
                emoji = '📚';
                message = '建議再仔細閱讀一次章節內容喔！';
            }

            const quizContent = document.getElementById('quizContent');
            quizContent.innerHTML = `
                <div class="quiz-result">
                    <h2>${emoji} 測驗完成！</h2>
                    <div class="quiz-score">${correctCount} / ${totalCount}</div>
                    <p>${message}</p>
                    <p style="font-size: 0.9em; color: #999;">答對率：${percentage}%</p>
                    <div class="quiz-buttons">
                        <button class="quiz-btn quiz-btn-secondary" onclick="closeQuiz()">關閉</button>
                        <button class="quiz-btn quiz-btn-primary" onclick="startQuiz()">再測一次</button>
                    </div>
                </div>
            `;
        }

        // 關閉測驗
        function closeQuiz() {
            document.getElementById('quizModal').classList.remove('active');
        }

        // 點擊背景關閉
        document.getElementById('quizModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeQuiz();
            }
        });

        // 頁面載入時執行
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
