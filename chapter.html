<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式學習 - 章節內容</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            color: #e0e0e0;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
            position: relative;
            z-index: 1;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 32px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.03);
            color: #9ca3af;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 500;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #e5e7eb;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .back-button .material-icons {
            font-size: 18px;
        }

        .header {
            margin-bottom: 48px;
        }

        .header h1 {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 2em;
            font-weight: 700;
            color: #f3f4f6;
            margin-bottom: 12px;
            line-height: 1;
        }

        .header .title-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
            border-radius: 12px;
            flex-shrink: 0;
            position: relative;
        }

        .header .title-icon .material-icons {
            font-size: 24px;
            color: #60a5fa;
            line-height: 0;
        }

        .header .subtitle {
            color: #6b7280;
            font-size: 1.05em;
            margin-left: 64px;
        }

        .level-section {
            margin-bottom: 40px;
        }

        .level-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .level-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .level-badge.beginner {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }

        .level-badge.intermediate {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }

        .level-badge.advanced {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .level-description {
            color: #6b7280;
            font-size: 0.9em;
        }

        .knowledge-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .knowledge-item {
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .knowledge-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .knowledge-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .knowledge-number {
            font-size: 0.85em;
            font-weight: 600;
            color: #6b7280;
            min-width: 28px;
        }

        .knowledge-title {
            font-size: 1em;
            font-weight: 500;
            color: #e5e7eb;
        }

        .knowledge-content {
            color: #9ca3af;
            font-size: 0.9em;
            line-height: 1.8;
        }

        .knowledge-content h3 {
            color: #60a5fa;
            margin: 20px 0 10px 0;
            font-size: 0.95em;
            font-weight: 600;
        }

        .knowledge-content ul {
            margin-left: 20px;
            margin-bottom: 12px;
        }

        .knowledge-content li {
            margin-bottom: 6px;
        }

        .knowledge-content p {
            margin-bottom: 12px;
        }

        .knowledge-content strong {
            color: #e5e7eb;
        }

        .collapsed { display: none; }

        .expanded {
            display: block;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .sub-section {
            margin-left: 16px;
            margin-top: 16px;
            padding-left: 16px;
            border-left: 2px solid rgba(96, 165, 250, 0.3);
        }

        .sub-section h4 {
            color: #60a5fa;
            font-size: 0.9em;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .quiz-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin: 40px 0;
            padding: 16px 32px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.8), rgba(139, 92, 246, 0.8));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .quiz-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
        }

        .quiz-button .material-icons {
            font-size: 22px;
        }

        /* Loading */
        .loading-overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .loading-overlay.hidden { display: none; }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(96, 165, 250, 0.2);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #6b7280;
            font-size: 1em;
        }

        /* Quiz Modal */
        .quiz-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            overflow-y: auto;
            backdrop-filter: blur(4px);
        }

        .quiz-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .quiz-container {
            background: #16161e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .quiz-header h2 {
            color: #f3f4f6;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .quiz-progress {
            color: #6b7280;
            font-size: 0.9em;
        }

        .quiz-question h3 {
            color: #e5e7eb;
            margin-bottom: 24px;
            font-size: 1.05em;
            line-height: 1.7;
            font-weight: 500;
        }

        .quiz-chapter {
            margin-bottom: 16px;
            padding: 12px 16px;
            background: rgba(59, 130, 246, 0.1);
            border-left: 3px solid #3b82f6;
            color: #60a5fa;
            font-size: 0.9em;
            border-radius: 0 8px 8px 0;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quiz-option {
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.02);
            color: #d1d5db;
        }

        .quiz-option:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.04);
        }

        .quiz-option.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        .quiz-option.correct {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }

        .quiz-option.incorrect {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .quiz-explanation {
            margin-top: 20px;
            padding: 16px 20px;
            background: rgba(251, 191, 36, 0.1);
            border-left: 3px solid #f59e0b;
            border-radius: 0 10px 10px 0;
            display: none;
            color: #fbbf24;
            font-size: 0.9em;
            line-height: 1.7;
        }

        .quiz-explanation.show { display: block; }

        .quiz-buttons {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .quiz-btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .quiz-btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }

        .quiz-btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .quiz-btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #9ca3af;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .quiz-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #e5e7eb;
        }

        .quiz-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .quiz-result {
            text-align: center;
            padding: 24px;
        }

        .quiz-result h2 {
            color: #f3f4f6;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .quiz-score {
            font-size: 3.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 24px 0;
        }

        .quiz-result p {
            color: #9ca3af;
            font-size: 1.05em;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .container { padding: 24px 16px; }
            .header h1 { font-size: 1.5em; }
            .header .subtitle { margin-left: 0; margin-top: 12px; }
            .knowledge-item { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">
            <span class="material-icons">arrow_back</span>
            返回主頁
        </a>
        
        <div class="header" id="header">
            <!-- 動態載入標題 -->
        </div>

        <div id="loadingOverlay" class="loading-overlay">
            <div class="loading-container">
                <div class="spinner"></div>
                <div class="loading-text">正在載入內容...</div>
            </div>
        </div>

        <div id="content">
            <!-- 動態載入內容 -->
        </div>
    </div>

    <!-- 測驗彈窗 -->
    <div id="quizModal" class="quiz-modal">
        <div class="quiz-container">
            <div id="quizContent"></div>
        </div>
    </div>

    <script>
        let quizData = null;
        let originalQuestions = null;
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let selectedAnswer = null;

        function getTopicIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('topic') || 'smart-home';
        }

        async function loadData() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            
            try {
                loadingOverlay.classList.remove('hidden');
                const topicId = getTopicIdFromURL();

                const configResponse = await fetch('config.json');
                const config = await configResponse.json();

                const topic = config.topics.find(t => t.id === topicId);
                if (!topic) {
                    throw new Error(`主題 ${topicId} 未找到`);
                }

                const levelPromises = topic.levels.map(level => 
                    fetch(level.jsonFile).then(res => res.json())
                );
                const levels = await Promise.all(levelPromises);

                const data = {
                    topic: {
                        id: topic.id,
                        title: topic.title,
                        icon: topic.icon,
                        subtitle: topic.subtitle,
                        questionFile: topic.questionFile
                    },
                    levels: levels
                };

                if (topic.questionFile) {
                    try {
                        const quizResponse = await fetch(topic.questionFile);
                        quizData = await quizResponse.json();
                        originalQuestions = [...quizData.questions];
                    } catch (err) {
                        console.warn('測驗資料載入失敗:', err);
                    }
                }

                renderContent(data);
                loadingOverlay.classList.add('hidden');
            } catch (error) {
                console.error('載入資料失敗:', error);
                loadingOverlay.classList.add('hidden');
                document.getElementById('content').innerHTML = `
                    <div style="text-align: center; padding: 60px; color: #6b7280;">
                        <span class="material-icons" style="font-size: 48px; margin-bottom: 16px; display: block;">error_outline</span>
                        <p>資料載入失敗，請重新整理頁面</p>
                    </div>
                `;
            }
        }

        function renderContent(data) {
            const header = document.getElementById('header');
            header.innerHTML = `
                <h1>
                    <div class="title-icon">
                        <span class="material-icons">${data.topic.icon}</span>
                    </div>
                    ${data.topic.title}
                </h1>
                <p class="subtitle">${data.topic.subtitle}</p>
            `;

            document.title = `${data.topic.title} - 互動式學習`;

            const content = document.getElementById('content');
            let html = '';

            const levelClasses = {
                1: 'beginner',
                2: 'intermediate', 
                3: 'advanced'
            };

            data.levels.forEach(level => {
                if (level.knowledgePoints.length === 0) return;

                const levelClass = levelClasses[level.level.order] || '';

                html += `
                    <div class="level-section">
                        <div class="level-header">
                            <span class="level-badge ${levelClass}">${level.level.name}</span>
                            <span class="level-description">${level.level.description}</span>
                        </div>
                        <div class="knowledge-list">
                `;

                level.knowledgePoints.forEach(point => {
                    const uniqueId = `${level.level.id}-${point.number}`;
                    if (point.sections && point.sections.length > 0) {
                        html += `
                            <div class="knowledge-item" onclick="toggleContent('${uniqueId}')">
                                <div class="knowledge-header">
                                    <div class="knowledge-number">${point.number}</div>
                                    <div class="knowledge-title">${point.title}</div>
                                </div>
                                <div class="knowledge-content collapsed" id="content-${uniqueId}">
                                    ${renderSections(point.sections)}
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="knowledge-item" style="opacity: 0.5; cursor: default;">
                                <div class="knowledge-header">
                                    <div class="knowledge-number">${point.number}</div>
                                    <div class="knowledge-title">${point.title}</div>
                                </div>
                                <p style="color: #6b7280; margin-top: 8px; font-size: 0.85em;">內容待補充</p>
                            </div>
                        `;
                    }
                });

                html += `
                        </div>
                    </div>
                `;
            });

            if (quizData && quizData.questions && quizData.questions.length > 0) {
                const totalQuestions = quizData.questions.length;
                const quizCount = Math.min(10, totalQuestions);
                html += `
                    <button class="quiz-button" onclick="startQuiz()">
                        <span class="material-icons">quiz</span>
                        開始測驗（題庫 ${totalQuestions} 題，隨機抽取 ${quizCount} 題）
                    </button>
                `;
            }

            content.innerHTML = html;
        }

        function renderSections(sections) {
            let html = '';
            sections.forEach(section => {
                html += `<h3>${section.heading}</h3>`;
                
                if (section.content) {
                    html += `<p>${section.content}</p>`;
                }
                
                if (section.list) {
                    html += '<ul>';
                    section.list.forEach(item => {
                        html += `<li>${item}</li>`;
                    });
                    html += '</ul>';
                }

                if (section.subSections) {
                    section.subSections.forEach(sub => {
                        html += '<div class="sub-section">';
                        html += `<h4>${sub.subHeading}</h4>`;
                        if (sub.content) {
                            html += `<p>${sub.content}</p>`;
                        }
                        if (sub.list) {
                            html += '<ul>';
                            sub.list.forEach(item => {
                                html += `<li>${item}</li>`;
                            });
                            html += '</ul>';
                        }
                        html += '</div>';
                    });
                }
            });
            return html;
        }

        function toggleContent(id) {
            const content = document.getElementById(`content-${id}`);
            if (content.classList.contains('collapsed')) {
                content.classList.remove('collapsed');
                content.classList.add('expanded');
            } else {
                content.classList.add('collapsed');
                content.classList.remove('expanded');
            }
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function randomizeQuestionOptions(question) {
            const optionIndices = [0, 1, 2, 3];
            const shuffledIndices = shuffleArray(optionIndices);
            const newCorrectAnswerIndex = shuffledIndices.indexOf(question.correctAnswer);
            const randomizedOptions = shuffledIndices.map(i => question.options[i]);
            
            return {
                options: randomizedOptions,
                correctAnswerIndex: newCorrectAnswerIndex,
                originalCorrectAnswer: question.correctAnswer
            };
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            userAnswers = [];
            selectedAnswer = null;
            
            if (originalQuestions && originalQuestions.length > 0) {
                const shuffled = shuffleArray([...originalQuestions]);
                quizData.questions = shuffled.slice(0, Math.min(10, shuffled.length));
            }
            
            showQuestion();
            document.getElementById('quizModal').classList.add('active');
        }

        function showQuestion() {
            const question = quizData.questions[currentQuestionIndex];
            const randomized = randomizeQuestionOptions(question);
            question._randomizedOptions = randomized.options;
            question._randomizedCorrectAnswer = randomized.correctAnswerIndex;
            
            const quizContent = document.getElementById('quizContent');
            const chapterInfo = question.chapter ? `<p class="quiz-chapter">章節：${question.chapter}</p>` : '';
            
            let html = `
                <div class="quiz-header">
                    <h2>測驗</h2>
                    <p class="quiz-progress">第 ${currentQuestionIndex + 1} / ${quizData.questions.length} 題</p>
                </div>
                <div class="quiz-question">
                    ${chapterInfo}
                    <h3>${question.question}</h3>
                    <div class="quiz-options">
            `;

            randomized.options.forEach((option, index) => {
                html += `
                    <div class="quiz-option" onclick="selectAnswer(${index})">
                        ${option}
                    </div>
                `;
            });

            html += `
                    </div>
                    <div class="quiz-explanation" id="explanation"></div>
                </div>
                <div class="quiz-buttons">
                    <button class="quiz-btn quiz-btn-secondary" onclick="closeQuiz()">關閉</button>
                    <button class="quiz-btn quiz-btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>提交答案</button>
                </div>
            `;

            quizContent.innerHTML = html;
            selectedAnswer = null;
        }

        function selectAnswer(index) {
            if (userAnswers[currentQuestionIndex] !== undefined) return;

            selectedAnswer = index;
            
            const options = document.querySelectorAll('.quiz-option');
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === index) {
                    opt.classList.add('selected');
                }
            });

            document.getElementById('submitBtn').disabled = false;
        }

        function submitAnswer() {
            if (selectedAnswer === null) return;

            const question = quizData.questions[currentQuestionIndex];
            const correctAnswerIndex = question._randomizedCorrectAnswer;
            const isCorrect = selectedAnswer === correctAnswerIndex;
            userAnswers[currentQuestionIndex] = isCorrect;

            const options = document.querySelectorAll('.quiz-option');
            options.forEach((opt, i) => {
                opt.style.pointerEvents = 'none';
                if (i === correctAnswerIndex) {
                    opt.classList.add('correct');
                } else if (i === selectedAnswer && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });

            const explanation = document.getElementById('explanation');
            explanation.innerHTML = `
                <strong>${isCorrect ? '正確' : '錯誤'}</strong><br>
                ${question.explanation}
            `;
            explanation.classList.add('show');

            const submitBtn = document.getElementById('submitBtn');
            if (currentQuestionIndex < quizData.questions.length - 1) {
                submitBtn.textContent = '下一題';
                submitBtn.onclick = nextQuestion;
            } else {
                submitBtn.textContent = '查看結果';
                submitBtn.onclick = showResult;
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            showQuestion();
        }

        function showResult() {
            const correctCount = userAnswers.filter(a => a === true).length;
            const totalCount = quizData.questions.length;
            const percentage = Math.round((correctCount / totalCount) * 100);

            let message = '';
            if (percentage >= 90) {
                message = '太棒了！你完全掌握了這個主題！';
            } else if (percentage >= 70) {
                message = '做得很好！繼續保持！';
            } else if (percentage >= 50) {
                message = '還不錯！再複習一下會更好！';
            } else {
                message = '建議再仔細閱讀一次章節內容';
            }

            const quizContent = document.getElementById('quizContent');
            quizContent.innerHTML = `
                <div class="quiz-result">
                    <h2>測驗完成</h2>
                    <div class="quiz-score">${correctCount} / ${totalCount}</div>
                    <p>${message}</p>
                    <p style="font-size: 0.9em; color: #6b7280;">答對率：${percentage}%</p>
                    <div class="quiz-buttons">
                        <button class="quiz-btn quiz-btn-secondary" onclick="closeQuiz()">關閉</button>
                        <button class="quiz-btn quiz-btn-primary" onclick="startQuiz()">再測一次</button>
                    </div>
                </div>
            `;
        }

        function closeQuiz() {
            document.getElementById('quizModal').classList.remove('active');
        }

        document.getElementById('quizModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeQuiz();
            }
        });

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
