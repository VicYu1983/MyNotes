<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式學習平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 50px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        .topic-card {
            background: white;
            border-radius: 15px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .topic-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .topic-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .topic-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .topic-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .topic-count {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .coming-soon {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .coming-soon:hover {
            transform: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .badge {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 5px 15px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .topics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 互動式學習平台</h1>
        
        <div class="topics-grid">
            <!-- 智能家居主題 -->
            <a href="smart-home.html" class="topic-card">
                <div class="topic-icon">🏠</div>
                <div class="topic-title">智能家居</div>
                <div class="topic-description">
                    從基礎概念到系統開發，全方位學習智能家居技術
                </div>
                <div class="topic-count">20 個知識點</div>
            </a>

            <!-- 未來主題預留位置 -->
            <div class="topic-card coming-soon">
                <div class="topic-icon">📱</div>
                <div class="topic-title">物聯網開發</div>
                <div class="topic-description">
                    即將推出...
                </div>
                <div class="badge">Coming Soon</div>
            </div>

            <div class="topic-card coming-soon">
                <div class="topic-icon">🤖</div>
                <div class="topic-title">人工智慧應用</div>
                <div class="topic-description">
                    即將推出...
                </div>
                <div class="badge">Coming Soon</div>
            </div>
        </div>
    </div>
</body>
</html>
