<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式學習平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 50px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        .topic-card {
            background: white;
            border-radius: 15px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .topic-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .topic-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .topic-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .topic-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .topic-count {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .coming-soon {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .coming-soon:hover {
            transform: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .badge {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 5px 15px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .topics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 互動式學習平台</h1>
        
        <div class="topics-grid" id="topicsGrid">
            <!-- 動態載入主題卡片 -->
        </div>
    </div>

    <script>
        async function loadTopics() {
            try {
                const response = await fetch('config.json');
                const config = await response.json();
                const grid = document.getElementById('topicsGrid');
                
                config.topics.forEach(topic => {
                    const card = document.createElement('a');
                    card.href = `chapter.html?topic=${topic.id}`;
                    card.className = 'topic-card';
                    card.innerHTML = `
                        <div class="topic-icon">${topic.icon}</div>
                        <div class="topic-title">${topic.title}</div>
                        <div class="topic-description">
                            ${topic.description}
                        </div>
                        <div class="topic-count">${topic.levels.length} 個階級</div>
                    `;
                    grid.appendChild(card);
                });

                // 添加Coming Soon卡片
                const comingSoonCards = [
                    { icon: '📱', title: '物聯網開發', description: '即將推出...' },
                    { icon: '🤖', title: '人工智慧應用', description: '即將推出...' }
                ];

                comingSoonCards.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'topic-card coming-soon';
                    card.innerHTML = `
                        <div class="topic-icon">${item.icon}</div>
                        <div class="topic-title">${item.title}</div>
                        <div class="topic-description">
                            ${item.description}
                        </div>
                        <div class="badge">Coming Soon</div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error('載入配置失敗:', error);
                document.getElementById('topicsGrid').innerHTML = '<p style="color: red;">載入失敗，請重新整理頁面。</p>';
            }
        }

        // 頁面載入時執行
        window.addEventListener('DOMContentLoaded', loadTopics);
    </script>
</body>
</html>
