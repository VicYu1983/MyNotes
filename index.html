<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式學習平台</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            color: #e0e0e0;
            line-height: 1.6;
        }

        /* 背景裝飾 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 40px;
            position: relative;
            z-index: 1;
        }

        /* 頁首 */
        .page-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .page-header h1 {
            font-size: 3em;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .page-header .subtitle {
            color: #6b7280;
            font-size: 1.1em;
            font-weight: 400;
        }

        /* 分類標籤 */
        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 48px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: #9ca3af;
            border-radius: 8px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            font-family: inherit;
        }

        .tab-button .material-icons {
            font-size: 20px;
            opacity: 0.7;
        }

        .tab-button:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
            color: #e5e7eb;
        }

        .tab-button.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
            color: #60a5fa;
        }

        .tab-button.active .material-icons {
            opacity: 1;
        }

        /* 內容區域 */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 卡片網格 */
        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        /* 主題卡片 */
        .topic-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 32px;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .topic-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .topic-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-4px);
        }

        .topic-card:hover::before {
            opacity: 1;
        }

        .topic-icon {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .topic-icon .material-icons {
            font-size: 28px;
            color: #60a5fa;
        }

        .topic-title {
            font-size: 1.35em;
            color: #f3f4f6;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .topic-description {
            color: #6b7280;
            line-height: 1.7;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .topic-count {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .level-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8em;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            color: #9ca3af;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .level-badge.beginner {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border-color: rgba(34, 197, 94, 0.2);
        }

        .level-badge.intermediate {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.2);
        }

        .level-badge.advanced {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.2);
        }

        /* Coming Soon */
        .coming-soon {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .coming-soon:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.02);
        }

        .badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 500;
        }

        /* 社群區塊 */
        .community-section {
            margin-top: 80px;
            padding: 48px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            text-align: center;
        }

        .community-section h2 {
            color: #f3f4f6;
            margin-bottom: 12px;
            font-size: 1.5em;
            font-weight: 600;
        }

        .community-section p {
            color: #6b7280;
            margin-bottom: 24px;
            font-size: 1em;
        }

        .facebook-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #1877F2;
            color: white;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 500;
            font-size: 1em;
            transition: all 0.2s ease;
        }

        .facebook-link:hover {
            background: #1565d8;
            transform: translateY(-2px);
        }

        .facebook-link .material-icons {
            font-size: 20px;
        }

        /* 響應式 */
        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            .page-header h1 {
                font-size: 2em;
            }

            .topics-grid {
                grid-template-columns: 1fr;
            }

            .tab-button {
                padding: 10px 16px;
                font-size: 0.9em;
            }

            .community-section {
                padding: 32px 20px;
            }
        }

        /* 長者友善版：保留資料與互動邏輯，只提高辨識度與可操作性。 */
        :root {
            --paper: #f7f3eb;
            --paper-strong: #fffdf8;
            --ink: #202b36;
            --muted: #52606d;
            --line: #c9d0d5;
            --blue: #075985;
            --blue-dark: #06466a;
            --gold: #f0b429;
            --shadow: 0 12px 28px rgba(32, 43, 54, 0.1);
        }

        * { letter-spacing: 0; }

        body {
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--paper);
            background-image: repeating-linear-gradient(0deg, rgba(7, 88, 133, 0.025) 0, rgba(7, 88, 133, 0.025) 1px, transparent 1px, transparent 7px);
            color: var(--ink);
            line-height: 1.8;
        }

        body::before { display: none; }

        .container {
            max-width: 1280px;
            padding: 48px 32px 72px;
        }

        .page-header {
            text-align: left;
            max-width: 860px;
            margin: 0 auto 36px;
            padding: 32px 36px;
            background: var(--paper-strong);
            border: 2px solid var(--line);
            border-left: 10px solid var(--blue);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .page-header h1 {
            color: var(--ink);
            background: none;
            -webkit-text-fill-color: initial;
            font-size: clamp(2rem, 4vw, 3.2rem);
            line-height: 1.25;
            margin-bottom: 8px;
        }

        .page-header .subtitle {
            color: var(--muted);
            font-size: 1.2rem;
        }

        .tabs-container {
            max-width: 1280px;
            margin: 0 auto 32px;
            gap: 12px;
            justify-content: flex-start;
        }

        .tab-button {
            min-height: 52px;
            padding: 12px 20px;
            border: 2px solid var(--line);
            background: var(--paper-strong);
            color: var(--ink);
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .tab-button:hover,
        .tab-button.active {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
        }

        .tab-button .material-icons { color: inherit; opacity: 1; }

        .tab-button:focus-visible,
        .topic-card:focus-visible,
        .facebook-link:focus-visible {
            outline: 4px solid var(--gold);
            outline-offset: 4px;
        }

        .topics-grid {
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1280px;
            margin: 0 auto;
        }

        .topic-card {
            min-height: 250px;
            padding: 28px;
            background: var(--paper-strong);
            border: 2px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(32, 43, 54, 0.06);
        }

        .topic-card:hover {
            background: #fff;
            border-color: var(--blue);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .topic-card::before { display: none; }

        .topic-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 18px;
            background: #dceef7;
            border: 2px solid #a9d0e3;
            border-radius: 8px;
        }

        .topic-icon .material-icons { color: var(--blue); font-size: 32px; }
        .topic-title { color: var(--ink); font-size: 1.35rem; font-weight: 800; }
        .topic-description { color: var(--muted); font-size: 1rem; line-height: 1.8; }

        .level-badge {
            padding: 6px 12px;
            border: 1px solid #aab5bd;
            border-radius: 5px;
            color: var(--ink);
            background: #eef1f3;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .level-badge.beginner { color: #14532d; background: #dcfce7; border-color: #86c79b; }
        .level-badge.intermediate { color: #713f12; background: #fef3c7; border-color: #e4bd63; }
        .level-badge.advanced { color: #7f1d1d; background: #fee2e2; border-color: #e8a1a1; }

        .community-section {
            max-width: 860px;
            margin: 48px auto 0;
            padding: 32px;
            background: #e8f3f7;
            border: 2px solid #a9d0e3;
            border-radius: 8px;
        }

        .community-section h2 { color: var(--ink); font-size: 1.5rem; }
        .community-section p { color: var(--muted); font-size: 1.05rem; }

        .facebook-link {
            min-height: 52px;
            padding: 12px 24px;
            border-radius: 7px;
            background: var(--blue);
            font-size: 1.05rem;
            font-weight: 700;
        }

        .facebook-link:hover { background: var(--blue-dark); transform: none; }

        @media (max-width: 768px) {
            .container { padding: 24px 16px 48px; }
            .page-header { padding: 24px 20px; border-left-width: 7px; }
            .page-header .subtitle { font-size: 1.05rem; }
            .tabs-container { display: grid; grid-template-columns: 1fr 1fr; }
            .tab-button { width: 100%; min-height: 56px; padding: 10px 8px; font-size: 0.98rem; }
            .tab-button .material-icons { font-size: 19px; }
            .topic-card { min-height: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>互動式學習平台</h1>
            <p class="subtitle">系統化學習智慧居家與物聯網技術</p>
        </div>
        
        <div class="tabs-container" id="tabsContainer">
            <!-- 動態載入分類標籤 -->
        </div>

        <div id="contentContainer">
            <!-- 動態載入標籤內容 -->
        </div>

        <div class="community-section">
            <h2>我的智能居家日記</h2>
            <p>加入社群，與其他學習者交流心得</p>
            <a href="https://www.facebook.com/groups/33956700450583718" target="_blank" class="facebook-link">
                <span class="material-icons">group</span>
                加入 Facebook 社團
            </a>
        </div>
    </div>

    <script>
        async function loadTopics() {
            try {
                const response = await fetch('config.json');
                const config = await response.json();
                
                // 等級對應樣式類別
                const levelClasses = {
                    1: 'beginner',
                    2: 'intermediate',
                    3: 'advanced'
                };
                
                const tabsContainer = document.getElementById('tabsContainer');
                const contentContainer = document.getElementById('contentContainer');
                
                // 添加 "全部" 分類
                const allCategories = [
                    { id: 'all', name: '全部課程', icon: 'apps' },
                    ...config.categories
                ];
                
                // 創建標籤按鈕
                allCategories.forEach((category, index) => {
                    const button = document.createElement('button');
                    button.className = `tab-button ${index === 0 ? 'active' : ''}`;
                    button.innerHTML = `<span class="material-icons">${category.icon}</span>${category.name}`;
                    button.onclick = (e) => switchTab(category.id, e);
                    tabsContainer.appendChild(button);
                });
                
                // 按分類組織主題
                const topicsByCategory = {
                    'all': config.topics
                };
                
                config.categories.forEach(cat => {
                    topicsByCategory[cat.id] = config.topics.filter(t => t.category === cat.id);
                });
                
                // 為每個分類創建內容容器
                Object.keys(topicsByCategory).forEach((categoryId, index) => {
                    const tabContent = document.createElement('div');
                    tabContent.className = `tab-content ${index === 0 ? 'active' : ''}`;
                    tabContent.id = `tab-${categoryId}`;
                    
                    const grid = document.createElement('div');
                    grid.className = 'topics-grid';
                    
                    topicsByCategory[categoryId].forEach(topic => {
                        const levelBadges = topic.levels.map(level => 
                            `<span class="level-badge ${levelClasses[level.order] || ''}">${level.name}</span>`
                        ).join('');
                        
                        const card = document.createElement('a');
                        card.href = `chapter.html?topic=${topic.id}`;
                        card.className = 'topic-card';
                        card.innerHTML = `
                            <div class="topic-icon">
                                <span class="material-icons">${topic.icon}</span>
                            </div>
                            <div class="topic-title">${topic.title}</div>
                            <div class="topic-description">${topic.description}</div>
                            <div class="topic-count">${levelBadges}</div>
                        `;
                        grid.appendChild(card);
                    });
                    
                    tabContent.appendChild(grid);
                    contentContainer.appendChild(tabContent);
                });
                
            } catch (error) {
                console.error('載入配置失敗:', error);
                document.getElementById('contentContainer').innerHTML = `
                    <div style="text-align: center; padding: 60px; color: #6b7280;">
                        <span class="material-icons" style="font-size: 48px; margin-bottom: 16px; display: block;">error_outline</span>
                        <p>載入失敗，請重新整理頁面</p>
                    </div>
                `;
            }
        }
        
        function switchTab(categoryId, e) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));
            
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(button => button.classList.remove('active'));
            
            const selectedContent = document.getElementById(`tab-${categoryId}`);
            if (selectedContent) {
                selectedContent.classList.add('active');
            }
            
            e.currentTarget.classList.add('active');
        }

        window.addEventListener('DOMContentLoaded', loadTopics);
    </script>
</body>
</html>
