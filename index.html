<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式學習平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 50px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        .tabs-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-button {
            padding: 12px 24px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 20px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .tab-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: white;
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .topic-card {
            background: white;
            border-radius: 15px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .topic-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .topic-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .topic-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .topic-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .topic-count {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }

        .level-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.85em;
        }

        .coming-soon {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .coming-soon:hover {
            transform: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .badge {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 5px 15px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .topics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 互動式學習平台</h1>
        
        <div class="tabs-container" id="tabsContainer">
            <!-- 動態載入分類標籤 -->
        </div>

        <div id="contentContainer">
            <!-- 動態載入標籤內容 -->
        </div>
    </div>

    <script>
        async function loadTopics() {
            try {
                const response = await fetch('config.json');
                const config = await response.json();
                
                // 根據階級順序定義顏色
                const levelColors = {
                    1: '#4caf50',  // 綠色 - 初階/入門
                    2: '#ff9800',  // 橙色 - 中階/進階
                    3: '#f44336'   // 紅色 - 高階/專業
                };
                
                // 渲染分類標籤
                const tabsContainer = document.getElementById('tabsContainer');
                const contentContainer = document.getElementById('contentContainer');
                
                // 添加 "全部" 分類
                const allCategories = [
                    { id: 'all', name: '全部課程', icon: '📚' },
                    ...config.categories
                ];
                
                // 創建標籤按鈕
                allCategories.forEach((category, index) => {
                    const button = document.createElement('button');
                    button.className = `tab-button ${index === 0 ? 'active' : ''}`;
                    button.textContent = `${category.icon} ${category.name}`;
                    button.onclick = () => switchTab(category.id);
                    tabsContainer.appendChild(button);
                });
                
                // 按分類組織主題
                const topicsByCategory = {
                    'all': config.topics
                };
                
                config.categories.forEach(cat => {
                    topicsByCategory[cat.id] = config.topics.filter(t => t.category === cat.id);
                });
                
                // 為每個分類創建內容容器
                Object.keys(topicsByCategory).forEach((categoryId, index) => {
                    const tabContent = document.createElement('div');
                    tabContent.className = `tab-content ${index === 0 ? 'active' : ''}`;
                    tabContent.id = `tab-${categoryId}`;
                    
                    const grid = document.createElement('div');
                    grid.className = 'topics-grid';
                    
                    // 添加該分類的所有主題卡片
                    topicsByCategory[categoryId].forEach(topic => {
                        const levelBadges = topic.levels.map(level => 
                            `<span class="level-badge" style="background: ${levelColors[level.order] || '#667eea'}">${level.name}</span>`
                        ).join('');
                        const card = document.createElement('a');
                        card.href = `chapter.html?topic=${topic.id}`;
                        card.className = 'topic-card';
                        card.innerHTML = `
                            <div class="topic-icon">${topic.icon}</div>
                            <div class="topic-title">${topic.title}</div>
                            <div class="topic-description">
                                ${topic.description}
                            </div>
                            <div class="topic-count">${levelBadges}</div>
                        `;
                        grid.appendChild(card);
                    });
                    
                    // 只在 "全部" 分類中添加 Coming Soon 卡片
                    if (categoryId === 'all') {
                        const comingSoonCards = [
                            { icon: '📱', title: '物聯網開發', description: '即將推出...' },
                            { icon: '🤖', title: '人工智慧應用', description: '即將推出...' }
                        ];

                        comingSoonCards.forEach(item => {
                            const card = document.createElement('div');
                            card.className = 'topic-card coming-soon';
                            card.innerHTML = `
                                <div class="topic-icon">${item.icon}</div>
                                <div class="topic-title">${item.title}</div>
                                <div class="topic-description">
                                    ${item.description}
                                </div>
                                <div class="badge">Coming Soon</div>
                            `;
                            grid.appendChild(card);
                        });
                    }
                    
                    tabContent.appendChild(grid);
                    contentContainer.appendChild(tabContent);
                });
                
            } catch (error) {
                console.error('載入配置失敗:', error);
                document.getElementById('contentContainer').innerHTML = '<p style="color: red;">載入失敗，請重新整理頁面。</p>';
            }
        }
        
        // Tab 切換函數
        function switchTab(categoryId) {
            // 隱藏所有標籤內容
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));
            
            // 移除所有按鈕的 active 類
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(button => button.classList.remove('active'));
            
            // 顯示選中的標籤內容
            const selectedContent = document.getElementById(`tab-${categoryId}`);
            if (selectedContent) {
                selectedContent.classList.add('active');
            }
            
            // 為點擊的按鈕添加 active 類
            event.target.classList.add('active');
        }

        // 頁面載入時執行
        window.addEventListener('DOMContentLoaded', loadTopics);
    </script>
</body>
</html>
